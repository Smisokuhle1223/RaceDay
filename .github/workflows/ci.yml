name: RaceDay CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check /docs folder exists
        run: |
          if [ ! -d "docs" ]; then
            echo "ERROR: /docs folder is missing"
            exit 1
          fi
          echo "docs folder found"

      - name: Check ERD file exists
        run: |
          if [ ! -f "docs/ERD.png" ]; then
            echo "ERROR: docs/ERD.png is missing"
            exit 1
          fi
          echo "ERD.png found"

      - name: Check API Endpoint Plan exists
        run: |
          if [ ! -f "docs/API_Endpoint_Plan.md" ]; then
            echo "ERROR: docs/API_Endpoint_Plan.md is missing"
            exit 1
          fi
          echo "API_Endpoint_Plan.md found"

      - name: Check SQL script exists
        run: |
          if [ ! -f "docs/RaceDay_Schema.sql" ]; then
            echo "ERROR: docs/RaceDay_Schema.sql is missing"
            exit 1
          fi
          echo "RaceDay_Schema.sql found"

      - name: Check README exists
        run: |
          if [ ! -f "README.md" ]; then
            echo "ERROR: README.md is missing"
            exit 1
          fi
          echo "README.md found"